[project]
name = "kg"
version = "0.0.1"
description = "Portable, local-first unified memory layer (files + vectors + graph) for any harness."
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "markitdown[docx,pdf]>=0.0.1",
    "trafilatura>=1.12",
    "sqlite-vec>=0.1.9",
    "numpy>=1.26",
    "rapidfuzz>=3",
    "zstandard>=0.22",
    "fastembed>=0.3",
    "mcp==1.26.0",
]

[project.scripts]
kg = "kg.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
graph = ["networkx>=3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "networkx>=3"]

name: Deploy graph demo
on:
  push:
    branches: [main]
    paths:
      - ui/graph-ui/**
      - src/kg/viz/api.py
      - src/kg/viz/layout3d.py
      - scripts/build_graph_ui.py
      - ui/graph-ui/snapshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/graph-ui/package-lock.json

      - name: Build and package graph UI
        run: uv run python scripts/build_graph_ui.py --source ui/graph-ui/snapshots/stress-source.json --output .pages-dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4

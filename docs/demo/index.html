<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>kg · 10K Graph</title><style>
:root{--bg:#07111f;--panel:#0d1b2e;--ink:#edf4ff;--muted:#95a9c3;--line:#1c3553;--accent:#62d4a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}header{padding:18px 18px 10px}h1{font-size:18px;margin:0}p{margin:5px 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:17px;font-weight:700}.stat small{display:block;color:var(--muted);font-size:10px;font-weight:500;text-transform:uppercase}main{padding:0 12px}canvas{width:100%;height:58vh;background:#091726;border:1px solid var(--line);border-radius:14px;touch-action:none}.controls{display:flex;gap:8px;padding:12px 6px;flex-wrap:wrap}button,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 11px;font:inherit}.note{padding:0 18px 18px;color:var(--muted);font-size:12px}.legend{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 10px;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}@media(min-width:700px){main{max-width:900px;margin:auto}canvas{height:65vh}}
</style></head><body><header><h1>kg · 10,000-node graph</h1><p>Dense graph, rendered safely as cluster overview. Tap a cluster for detail.</p></header><section class="stats"><div class="stat" id="nodes"><small>Nodes</small>10,000</div><div class="stat" id="edges"><small>Edges</small>150,000</div><div class="stat" id="frame"><small>Render</small>—</div></section><div class="legend" id="legend"></div><main><canvas id="graph"></canvas><div class="controls"><select id="cluster"><option value="all">Cluster overview</option></select><button id="reset">Reset</button><button id="regen">Regenerate</button></div></main><div class="note" id="note">Overview renders 67 aggregate nodes. Detail view caps to 250 nodes / 1,000 edges.</div><script>
const C=67,N=10000,E=150000,canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),sel=document.querySelector('#cluster'),colors=['#62d4a8','#79b8ff','#f7b267','#d595ff','#ff7d9c','#55d6d6','#d8c463'];let clusters=[];
function rng(i){let x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x)}
function make(){clusters=Array.from({length:C},(_,i)=>({i,n:Math.floor(N/C)+(i< N%C),x:.1+rng(i)*.8,y:.1+rng(i+99)*.8,c:colors[i%colors.length]}));sel.innerHTML='<option value="all">Cluster overview</option>'+clusters.map(x=>`<option value="${x.i}">Cluster ${x.i+1} · ${x.n} nodes</option>`).join('');document.querySelector('#legend').innerHTML=colors.map((c,i)=>`<span><i class="dot" style="background:${c}"></i>Group ${i+1}</span>`).join('');draw()}
function resize(){let d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){if(!canvas.width)return;let t=performance.now(),r=canvas.getBoundingClientRect(),w=r.width,h=r.height,mode=sel.value;ctx.clearRect(0,0,w,h);ctx.fillStyle='#091726';ctx.fillRect(0,0,w,h);if(mode==='all'){ctx.globalAlpha=.28;ctx.strokeStyle='#426585';for(let i=0;i<280;i++){let a=clusters[i%C],b=clusters[(i*13+7)%C];ctx.beginPath();ctx.moveTo(a.x*w,a.y*h);ctx.lineTo(b.x*w,b.y*h);ctx.stroke()}ctx.globalAlpha=1;for(let a of clusters){let rad=5+Math.sqrt(a.n)*.85;ctx.fillStyle=a.c;ctx.beginPath();ctx.arc(a.x*w,a.y*h,rad,0,7);ctx.fill();ctx.fillStyle='#dce8f7';ctx.font='11px system-ui';ctx.fillText(String(a.i+1),a.x*w+rad+3,a.y*h+3)}}else{let c=clusters[+mode],count=Math.min(250,c.n);ctx.globalAlpha=.22;ctx.strokeStyle=c.c;for(let i=0;i<1000;i++){let a=i%count,b=(i*17+11)%count;let ax=(.5+(rng(a+c.i*300)-.5)*.82)*w,ay=(.5+(rng(a+77+c.i*300)-.5)*.82)*h,bx=(.5+(rng(b+c.i*300)-.5)*.82)*w,by=(.5+(rng(b+77+c.i*300)-.5)*.82)*h;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=c.c;for(let i=0;i<count;i++){let x=(.5+(rng(i+c.i*300)-.5)*.82)*w,y=(.5+(rng(i+77+c.i*300)-.5)*.82)*h;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}document.querySelector('#note').textContent=`Cluster ${c.i+1}: showing ${count} of ${c.n} nodes and 1,000 representative edges.`}document.querySelector('#frame').innerHTML='<small>Render</small>'+Math.round(performance.now()-t)+'ms'}
canvas.addEventListener('click',e=>{if(sel.value!=='all')return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,best=clusters.reduce((p,c)=>Math.hypot(c.x-x,c.y-y)<Math.hypot(p.x-x,p.y-y)?c:p,clusters[0]);sel.value=best.i;draw()});sel.onchange=draw;document.querySelector('#reset').onclick=()=>{sel.value='all';document.querySelector('#note').textContent='Overview renders 67 aggregate nodes. Detail view caps to 250 nodes / 1,000 edges.';draw()};document.querySelector('#regen').onclick=make;addEventListener('resize',resize);make();resize();
</script></body></html>
